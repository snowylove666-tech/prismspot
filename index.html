<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrismSpot 搜的快</title>
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d1b17;--muted:#6f685c;--line:#e3ddd0;--accent:#e0482a}
@media (prefers-color-scheme:dark){:root{--bg:#171613;--card:#1f1d19;--ink:#ece6da;--muted:#a39b8c;--line:#34302a;--accent:#f0663f}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.75}
main{max-width:760px;margin:0 auto;padding:48px 16px 64px;text-align:center}
img{width:112px;height:112px}
h1{font-size:30px;margin:12px 0 4px}
.lead{color:var(--muted);font-size:17px;margin:0 0 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin:16px auto;text-align:left;max-width:560px}
a{color:var(--accent)}
ul{padding-left:22px;margin:0}
</style>
</head>
<body><main>
<img src="icon.svg" alt="PrismSpot 搜的快">
<h1>PrismSpot 搜的快</h1>
<p class="lead">按 Ctrl+Space，搜电脑上的应用、文件和文档内容。</p>
<div class="card">
<ul>
<li>文件名和 PDF、Word、Excel、PPT、文本的正文都能搜，原样预览并标出每处命中。</li>
<li>所有内容只保存在你自己的电脑上。</li>
<li>会员可以让 Claude、Cursor 等 AI 助手搜索你的文件（AI 接入）。</li>
</ul>
</div>
<div class="card">
<ul>
<li>下载：在 Microsoft Store 搜索「PrismSpot 搜的快」。</li>
<li>反馈和帮助：<a href="https://github.com/snowylove666-tech/prismspot/issues">提交反馈</a></li>
<li><a href="privacy.html">隐私政策</a></li>
</ul>
</div>
</main></body>
</html>
